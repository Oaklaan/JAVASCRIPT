<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Background Color Changer</title>
</head>
<body>
    <nav>
        <a href="../index.html">Home</a>
    </nav>
    <div class="canvas">
        <h1>color scheme switcher</h1>
        <button class="button" id="grey" type="button" aria-label="Change background to grey"></button>
        <button class="button" id="white" type="button" aria-label="Change background to white"></button>
        <button class="button" id="blue" type="button" aria-label="Change background to blue"></button>
        <button class="button" id="yellow" type="button" aria-label="Change background to yellow"></button>
        <h2>try clicking on one of the color above
            <span> to change the colour of the background!</span>
        </h2>
    </div>
    <script src="script.js"></script>
</body>
</html>
